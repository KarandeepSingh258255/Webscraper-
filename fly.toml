app = "webscraper-portal"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PORTAL_COOKIE_SECURE = "true"
  PORTAL_DB_PATH = "/data/agent_state.sqlite3"
  PORTAL_DRAFT_DIR = "/data/drafts"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25
